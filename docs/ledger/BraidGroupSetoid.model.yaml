human_notes: |
  ⚠ 这是 B₃ 的 **setoid 模型**，不是 `Algebra/GroupTheory/BraidGroup.B3`（严格 record）的实例。
  **为什么不改严格版**：`B3` 的 `≡` 承载 `W-central-σ₁/σ₂`（60 行真内容）；
  把 `≡` 改成 `≈` 会让那些证明作废——那是裁剪成果凑形式。正解是**泛化**：
  setoid 版是严格版的推广（取 `_≈_ := _≡_` 即严格版），严格版定理仍成立且更强。
  `strict→setoid` 的强制转换**未做**：需要先从「右逆 + 双单位」导出左逆（经典群论练习，
  约 30 行的结合律重排）；见 Q1 原子表。
  严格实例（若将来要）：载体 = 24 元 SL23 + toMat 单射（576 例）+ assoc，约 700 行。
